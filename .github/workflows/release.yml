# Tests, then builds every installable file. Landing a new pubspec.yaml version
# on main, or pushing a tag like v1.2.0, publishes them as a GitHub Release;
# running it by hand only leaves them as workflow artifacts.
name: Release

on:
  push:
    branches: [main]
    paths: [pubspec.yaml]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.1'

jobs:
  version:
    name: Work out version
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.version.outputs.name }}
      number: ${{ github.run_number }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          pubspec=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          name=$pubspec
          if [ "$REF_TYPE" = tag ]; then
            name=${REF_NAME#v}
            case "$name" in
              "$pubspec"|"$pubspec"-*) ;;
              *) echo "::error::Tag $REF_NAME does not match pubspec.yaml version $pubspec"; exit 1;;
            esac
          elif [ "$EVENT" = push ] && git ls-remote --exit-code --tags origin "refs/tags/v$name" > /dev/null; then
            # pubspec.yaml changed but the version didn't, like a dependency bump.
            echo "v$name is already released, nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    needs: version
    if: needs.version.outputs.skip != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android
    runs-on: ubuntu-latest
    needs: [version, test]
    env:
      BUILD: --build-name=${{ needs.version.outputs.name }} --build-number=${{ needs.version.outputs.number }}
      VERSION: ${{ needs.version.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$EVENT" = push ]; then
              echo "::error::No signing secrets: a debug-signed release couldn't be updated by later ones."
              exit 1
            fi
            echo "::warning::No signing secrets: Android builds use a throwaway debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > android/key.properties
      - run: flutter build apk --release $BUILD
      - run: flutter build apk --release --split-per-abi $BUILD
      - run: flutter build appbundle --release $BUILD
      - name: Collect files
        run: |
          mkdir dist
          out=build/app/outputs
          cp $out/flutter-apk/app-release.apk "dist/FamilyHealth-$VERSION-android-universal.apk"
          cp $out/flutter-apk/app-arm64-v8a-release.apk "dist/FamilyHealth-$VERSION-android-arm64.apk"
          cp $out/flutter-apk/app-armeabi-v7a-release.apk "dist/FamilyHealth-$VERSION-android-armv7.apk"
          cp $out/flutter-apk/app-x86_64-release.apk "dist/FamilyHealth-$VERSION-android-x86_64.apk"
          cp $out/bundle/release/app-release.aab "dist/FamilyHealth-$VERSION-android.aab"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: dist/
          if-no-files-found: error

  apple:
    name: macOS and iOS
    runs-on: macos-26
    needs: [version, test]
    env:
      BUILD: --build-name=${{ needs.version.outputs.name }} --build-number=${{ needs.version.outputs.number }}
      VERSION: ${{ needs.version.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build macos --release $BUILD
      - name: Package macOS disk image
        run: |
          mkdir -p dist dmg
          cp -R "build/macos/Build/Products/Release/Family Health.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Family Health" -srcfolder dmg -format UDZO "dist/FamilyHealth-$VERSION-macos.dmg"
      - run: flutter build ios --release --no-codesign $BUILD
      - name: Package unsigned iOS app
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "dist/FamilyHealth-$VERSION-ios-unsigned.ipa" Payload
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [version, android, apple]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Write checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ needs.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(needs.version.outputs.name, '-') }}
