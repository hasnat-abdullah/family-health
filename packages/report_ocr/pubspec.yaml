name: report_ocr
description: "On-device OCR for medical reports (Apple Vision on iOS/macOS, ML Kit on Android)."
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.13.1
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.familyhealth.report_ocr
        pluginClass: ReportOcrPlugin
      ios:
        pluginClass: ReportOcrPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: ReportOcrPlugin
        sharedDarwinSource: true
